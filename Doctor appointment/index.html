<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LEFT: Photo  -->
    <div class="photo-section">
        <div class="doctor-photo">
            <img src="doc stock.jpg" alt="Doctor">
        </div>
    </div>

    <!-- RIGHT: Form  -->
    <div class="form-section">
        <h1>Doctor Appointment Form</h1>

        <!-- Appointment Date  -->
        <div class="form-row">
            <div class="form-group">
                <label for="date">Appointment Date</label>
                <input type="date" id="date">
            </div>
        </div>

        <!-- Appointment Time -->
        <div class="form-row">
            <div class="form-group">
                <label for="time">Appointment Time</label>
                <input type="time" id="time">
            </div>
        </div>

        <!-- Name (First + Last) -->
        <div class="form-row">
            <div class="form-group">
                <label>Name</label>
                <div class="name-group">
                    <input type="text" placeholder="First">
                    <input type="text" placeholder="Last">
                </div>
            </div>
        </div>

        <!-- Gender -->
        <div class="form-row">
            <div class="form-group">
                <label>Gender</label>
                <div class="gender-group">
                    <input type="radio" name="gender" id="male" value="male">
                    <label for="male">Male</label>
                    <input type="radio" name="gender" id="female" value="female">
                    <label for="female">Female</label>
                </div>
            </div>
        </div>

        <!-- Phone -->
        <div class="form-row">
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="#######">
            </div>
        </div>

        <!-- Address (city + state) -->
        <div class="form-row">
            <div class="form-group">
                <label>Address</label>
                <div class="address-group">
                    <input type="text" placeholder="city">
                    <input type="text" placeholder="state">
                </div>
            </div>
        </div>

        <!-- Your Query -->
        <div class="form-row">
            <div class="form-group">
                <label for="query">Your Query</label>
                <textarea id="query" rows="1"></textarea>
            </div>
        </div>

        <!-- Appointment Type (each on separate line) -->
        <div class="appointment-type">
            <label>Appointment Type</label>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox"> Cervix checkup
                </label>
                <label>
                    <input type="checkbox"> Heart checkup
                </label>
                <label>
                    <input type="checkbox"> Eye check-up
                </label>
                <label>
                    <input type="checkbox"> Hearing Test
                </label>
            </div>
        </div>

        <!-- Send Button  -->
        <button class="send-btn">Send</button>
    </div>

</body>
</html>
